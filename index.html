<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <meta
        name="description"
        content="منوی دیجیتال رستوران"
    >

    <title>منوی رستوران</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="restaurant-header">

        <div class="header-content">

            <div class="restaurant-brand">

                <div class="restaurant-logo">
                    R
                </div>

                <div>
                    <h1>رستوران رایکا</h1>
                    <span>منوی دیجیتال</span>
                </div>

            </div>

            <div class="header-status">

                <span class="status-dot"></span>

                <span>
                    باز است
                </span>

            </div>

        </div>

    </header>


    <!-- =========================
         CATEGORY NAVIGATION
    ========================== -->

    <nav class="category-wrapper">

        <div
            id="categoryBar"
            class="category-bar"
        >

            <button
                class="category-item active"
                data-category="all"
            >
                همه
            </button>

        </div>

    </nav>


    <!-- =========================
         MAIN MENU
    ========================== -->

    <main id="menuContainer">

        <!--
            محصولات توسط app.js
            اینجا ساخته می‌شوند.
        -->

        <section class="loading-section">

            <div class="loading-spinner"></div>

            <p>
                در حال دریافت منو...
            </p>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="restaurant-footer">

        <div class="footer-logo">
            R
        </div>

        <h2>
            رستوران رایکا
        </h2>

        <p>
            لحظات خوب، طعم‌های ماندگار
        </p>

        <div class="footer-line"></div>

        <small>
            منوی دیجیتال رستوران
        </small>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="app.js"></script>

</body>
</html>
